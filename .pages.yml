# Configuración del panel de edición (Pages CMS: https://app.pagescms.org).
# Define qué se puede editar desde el panel y con qué formulario.
# Cada vez que alguien guarda en el panel se crea un commit en GitHub y la web se republica sola.

settings:
  content:
    merge: true # conserva los campos del fichero que no aparecen en el formulario

media:
  input: src/assets/img/fotos
  output: /assets/img/fotos
  categories: [image]

content:
  # ---------------------------------------------------------------- Horarios
  - name: misas
    label: Horarios de misa
    description: Misas de cada semana y cambios de horario por fiestas o temporada.
    type: file
    path: src/_data/misas.json
    format: json
    fields:
      - name: semanal
        label: Misas de cada semana
        description: Una línea por misa. Si una misa se repite varios días a la misma hora y en el mismo sitio, marca todos los días en la misma línea.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{hora} · {parroquia} {lugar}"
        fields:
          - name: dias
            label: Días
            type: select
            required: true
            options:
              multiple: true
              values:
                - { value: lunes, label: Lunes }
                - { value: martes, label: Martes }
                - { value: miercoles, label: Miércoles }
                - { value: jueves, label: Jueves }
                - { value: viernes, label: Viernes }
                - { value: sabado, label: Sábado }
                - { value: domingo, label: Domingo }
          - name: hora
            label: Hora
            description: Con dos cifras y dos puntos, por ejemplo 09:30 o 19:30.
            type: string
            required: true
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: Escribe la hora así, 09:30 o 19:30.
          - name: parroquia
            label: Parroquia
            type: reference
            required: true
            options:
              collection: parroquias
              value: "{slug}"
              label: "{nombre}"
              search: nombre
          - name: lugar
            label: Lugar (opcional)
            description: Solo si no es en la iglesia parroquial. Por ejemplo, Capilla de la Obra Pía.
            type: string
      - name: aviso
        label: Nota bajo los horarios
        type: text
      - name: especiales
        label: Horarios especiales
        description: Cambios de verano, Navidad, Semana Santa o fiestas. Bórralos cuando pasen.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: texto, label: Texto, type: text, required: true }

  # -------------------------------------------------------------- Parroquias
  - name: parroquias
    label: Parroquias
    description: Una ficha por parroquia. Al crear una nueva, su página aparece sola en la web.
    type: collection
    path: contenido/parroquias
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [nombre, templo]
      primary: nombre
      sort: [nombre]
      search: [nombre, templo]
      default:
        sort: nombre
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: slug
        label: Identificador
        description: El nombre en minúsculas, sin tildes ni espacios (por ejemplo, ques o san-juan-de-berbio). Se usa en la dirección de la página. No lo cambies una vez creada.
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Solo minúsculas sin tildes, números y guiones.
      - { name: templo, label: Iglesia, description: "Por ejemplo, Iglesia de San Pedro.", type: string }
      - { name: advocacion, label: Advocación, type: string }
      - { name: fiestas, label: Fiestas, description: "Fiestas patronales y fechas.", type: string }
      - { name: pueblo, label: El pueblo, description: "Unas líneas sobre el pueblo: dónde está, cómo es, qué lo caracteriza.", type: text }
      - { name: historia, label: Historia, type: text }
      - { name: direccion, label: Dirección, type: string }
      - name: mapa
        label: Enlace de Google Maps
        description: "Opcional. En Google Maps, abre la iglesia y pulsa Compartir → Copiar enlace. Si se deja vacío, la web busca la iglesia por su nombre."
        type: string
      - name: foto
        label: Foto
        description: Mejor en horizontal. Que sea propia o con permiso del autor.
        type: image
      - name: fotoCredito
        label: Autor de la foto
        description: "Si la foto no es tuya: autor y licencia. Por ejemplo, Foto: Ana García."
        type: string

  # ------------------------------------------------------------- Actividades
  - name: actividades
    label: Actividades
    description: Catequesis, Cáritas, grupos y fiestas.
    type: file
    path: src/_data/actividades.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{titulo}"
    fields:
      - name: id
        label: Identificador
        description: En minúsculas y sin tildes (por ejemplo, caritas). No lo cambies.
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Solo minúsculas sin tildes, números y guiones.
      - { name: titulo, label: Título, type: string, required: true }
      - { name: texto, label: Descripción, type: text }
      - name: detalles
        label: Horarios y detalles
        description: "Una línea por cada cosa. Por ejemplo, Domingos a las 11:00 en Sevares."
        type: string
        list: true

  # ------------------------------------------------------------------ Avisos
  - name: avisos
    label: Avisos de la portada
    description: Opcional. Los avisos normales van al grupo de WhatsApp; usa esto solo para algo que deba destacar en la web. Bórralos cuando pasen.
    type: file
    path: src/_data/avisos.json
    format: json
    list:
      collapsible:
        collapsed: false
        summary: "{titulo}"
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: texto, label: Texto, type: text, required: true }
      - { name: enlace, label: Enlace (opcional), type: string }

  # ------------------------------------------------------- Contacto y datos
  - name: datos
    label: Contacto y datos generales
    description: Despacho, sacerdotes, WhatsApp y datos legales.
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: despacho
        label: Despacho parroquial
        type: object
        fields:
          - { name: direccion, label: Dirección, type: string }
          - { name: telefono, label: Teléfono, type: string }
          - { name: email, label: Correo, type: string }
          - { name: horario, label: Horario de atención, type: string }
      - name: sacerdotes
        label: Sacerdotes
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{cargo}: {nombre}"
        fields:
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: cargo, label: Cargo, description: "Por ejemplo, Párroco o Vicario parroquial.", type: string }
          - { name: telefono, label: Teléfono, type: string }
      - name: whatsapp
        label: Enlace del grupo de WhatsApp
        type: string
      - name: borrador
        label: Modo propuesta
        description: Mientras esté marcado, la web muestra la franja «Propuesta de web, no oficial» y Google no la indexa. Desmárcalo cuando la web sea oficial.
        type: boolean
      - name: titular
        label: Titular de la web (aviso legal)
        type: object
        fields:
          - { name: denominacion, label: Entidad titular, type: string }
          - { name: cif, label: CIF, type: string }
          - { name: domicilio, label: Domicilio, type: string }
          - { name: email, label: Correo, type: string }
          - { name: registroEntidadesReligiosas, label: N.º en el Registro de Entidades Religiosas, type: string }
      - { name: ultimaRevisionLegal, label: Fecha de la última revisión de los textos legales, type: string }
      - name: nombre
        label: Nombre de la web
        type: string
        hidden: true
      - { name: lema, label: Lema, type: string, hidden: true }
      - { name: descripcion, label: Descripción para buscadores, type: text, hidden: true }
      - { name: numeroParroquias, label: Número de parroquias, type: number, hidden: true }
